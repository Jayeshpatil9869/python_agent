[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "website-intelligence-agent"
version = "1.0.0"
description = "Website Reverse-Engineering / Design Intelligence Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Website Intelligence Agent" }]
dependencies = [
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "Jinja2>=3.1.0",
    "cssutils>=2.9.0",
]

[project.optional-dependencies]
ai = [
    "openai>=1.12.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.4.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
website-intelligence = "main:run"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "config*",
    "agent*",
    "crawler*",
    "analyzers*",
    "observation*",
    "intelligence*",
    "ai*",
    "reports*",
    "models*",
    "utils*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
